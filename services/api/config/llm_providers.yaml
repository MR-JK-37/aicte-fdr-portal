# LLM provider registry. Loaded by app/llm_gateway/registry.py.
#
# Verification status of each entry is explicit via `verified`. Only
# `groq` has been hit live (model list + a real completion) in this
# session — see progress.md for the exact verification commands/output.
# Every other provider is a config placeholder: real, structurally
# correct, matching the OpenAI-compatible wire format where applicable,
# but its model IDs/limits are NOT hard-coded facts — they are what
# scripts/check_providers.py will discover and overwrite at startup/CI
# time once a key is supplied, per the brief's "never hard-code
# unverified IDs" rule. Do not treat an unverified entry's `models` list
# as ground truth.

providers:
  groq:
    verified: true
    verified_on: "2026-10-23"
    base_url: "https://api.groq.com/openai/v1"
    openai_compatible: true
    key_env_var: GROQ_API_KEY
    model_list_endpoint: "/models"
    # Verified live via GET /models and a real chat completion (see
    # progress.md). Context/output windows and features are copied
    # directly from that response, not guessed.
    models:
      - id: "openai/gpt-oss-120b"
        context_window: 131072
        max_output_tokens: 65536
        capabilities: {tools: true, json_mode: true, vision: false, structured_outputs: true, reasoning: true}
      - id: "openai/gpt-oss-20b"
        context_window: 131072
        max_output_tokens: 65536
        capabilities: {tools: true, json_mode: true, vision: false, structured_outputs: true, reasoning: true}
      - id: "openai/gpt-oss-safeguard-20b"
        context_window: 131072
        max_output_tokens: 65536
        capabilities: {tools: true, json_mode: true, vision: false, structured_outputs: true, reasoning: true}
        role: "safety-classifier"
      - id: "qwen/qwen3.8-27b"
        context_window: 131072
        max_output_tokens: 16384
        capabilities: {tools: true, json_mode: true, vision: true, structured_outputs: false, reasoning: false}
      - id: "meta-llama/llama-prompt-guard-2-86m"
        context_window: 512
        max_output_tokens: 512
        capabilities: {tools: false, json_mode: true, vision: false, structured_outputs: false, reasoning: false}
        role: "prompt-injection-classifier"
    # Verified live from response headers on a real request with THIS
    # account's key (openai/gpt-oss-20b): x-ratelimit-limit-requests=1000,
    # x-ratelimit-limit-tokens=8000, reset windows ~1min/~1s. Limits are
    # commonly per-model and per-account-tier on Groq — re-verify with
    # check_providers.py rather than trusting this snapshot long-term.
    limits:
      rpm: 1000
      tpm: 8000
      verified_against_model: "openai/gpt-oss-20b"
    data_policy:
      retains_prompts: "unknown — not confirmed against Groq's current ToS in this session"
      trains_on_prompts: "unknown — not confirmed against Groq's current ToS in this session"
      region: "unknown"
    tier_eligibility: ["P"]  # Tier S (sensitive-agent) needs a confirmed no-retention policy; not confirmed here.

  openrouter:
    verified: true
    verified_on: "2026-10-25"
    base_url: "https://openrouter.ai/api/v1"
    openai_compatible: true
    key_env_var: OPENROUTER_API_KEY
    model_list_endpoint: "/models"
    models:
      - id: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"
        context_window: 131072
        max_output_tokens: 8192
        capabilities: {tools: true, json_mode: true, vision: false, structured_outputs: true, reasoning: true}
