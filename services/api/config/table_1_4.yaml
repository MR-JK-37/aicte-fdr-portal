# PLACEHOLDER VALUES — NOT VERIFIED AGAINST A CURRENT AICTE APPROVAL PROCESS
# HANDBOOK (APH). The source blueprint for this project explicitly flags
# Table 1.4's real figures and the leased-campus multiplier as an open
# question to resolve with AICTE (Blueprint.txt, section 17, item 1) rather
# than a number this build has verified. Do not use these amounts for any
# real determination; they exist so the shortfall-checker's *logic* (lookup
