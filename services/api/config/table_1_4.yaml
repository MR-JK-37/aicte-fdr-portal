#
# Amounts are per-programme base security deposit, in INR.
programme_base_amounts:
  DIPLOMA: 500000
  UG_DEGREE: 1000000
  PG_DEGREE: 1500000
  PHD: 2000000

# Multiplier applied to the required total when the institution's campus
# land is leased rather than owned. Also unverified (APH conflict).
leased_multiplier: 2.0
