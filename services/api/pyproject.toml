[project]
name = "fdr-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
# Alembic's own templates generate migrations/env.py and the revision
# boilerplate in this style; they're machine-written and regenerated by
# `alembic revision`, not hand-maintained to this project's lint rules.
extend-exclude = ["migrations/env.py", "migrations/versions"]
