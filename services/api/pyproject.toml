[project]
name = "fdr-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.118",
    "clamd>=1.0.2",
    "fastapi>=0.161.1",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "langgraph>=1.2.16",
    "pdf2image>=1.17.0",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "pypdf>=6.21.2",
    "pytesseract>=0.3.13",
    "python-dateutil>=2.9.0.post0",
    "python-magic>=0.4.27",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "sqlglot>=30.24.0",
    "uvicorn[standard]>=0.54.0",
    "pyhanko>=0.38.0",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.10.0",
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
# Alembic's own templates generate migrations/env.py and the revision
# boilerplate in this style; they're machine-written and regenerated by
# `alembic revision`, not hand-maintained to this project's lint rules.
extend-exclude = ["migrations/env.py", "migrations/versions"]

[tool.pytest.ini_options]
markers = [
    "slow: does real OCR/PDF rendering work and takes minutes; excluded from the default `make verify` run, included by `api-test-slow`.",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (`Depends(...)` as a default
# argument) is the idiomatic, documented way to use it — not the mutable-
# default-argument footgun B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "app.auth.deps.require_permission",
    "require_permission",
]
