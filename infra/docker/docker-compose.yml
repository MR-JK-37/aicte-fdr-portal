name: fdr-portal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fdr
      POSTGRES_PASSWORD: fdr
      POSTGRES_DB: fdr
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdr -d fdr"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY:-devaccesskey}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY:-devsecretkeydevsecretkey}
      GARAGE_DEFAULT_BUCKET: fdr-documents
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"
      - "3903:3903"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3903/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: ../../services/api
    restart: "no"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://fdr:fdr@db:5432/fdr
      DATABASE_URL: postgresql+psycopg://fdr_app:fdr_app_dev_password@db:5432/fdr
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ../../services/api
    restart: unless-stopped
    environment:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://fdr_app:fdr_app_dev_password@db:5432/fdr
      VALKEY_URL: redis://valkey:6379/0
      GARAGE_ENDPOINT: http://garage:3900
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../../services/worker
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      DATABASE_URL: postgresql+psycopg://fdr_app:fdr_app_dev_password@db:5432/fdr
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: ../../services/worker
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "app.celery_app", "beat", "--loglevel=INFO"]
    environment:
      VALKEY_URL: redis://valkey:6379/0
      DATABASE_URL: postgresql+psycopg://fdr_app:fdr_app_dev_password@db:5432/fdr
    depends_on:
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8081:80"
    depends_on:
      - api
      - keycloak

volumes:
  db_data:
  valkey_data:
  garage_meta:
  garage_data:
